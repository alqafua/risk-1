<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>السجل - Risk Guard</title>
<style>body{font-family:-apple-system,Tahoma,sans-serif;background:#0f1115;color:#eee;margin:0;padding:16px;}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}.nav-link{color:#3b82f6;text-decoration:none;font-size:13px;}.event{background:#1a1d24;border-radius:10px;padding:12px;margin-bottom:8px;}.event-type{font-weight:bold;font-size:13px;}.event-time{font-size:11px;color:#999;}.event-details{font-size:12px;color:#ccc;margin-top:6px;white-space:pre-wrap;word-break:break-all;}.symbol-tag{background:#333;padding:2px 8px;border-radius:6px;font-size:11px;margin-right:6px;}</style></head>
<body><div class="header"><h1 style="font-size:18px;">📋 السجل</h1><a class="nav-link" href="{{ url_for('dashboard') }}">← رجوع للوحة التحكم</a></div>{% for e in events %}<div class="event"><span class="event-type">{{ e.event_type }}</span>{% if e.symbol %}<span class="symbol-tag">{{ e.symbol }}</span>{% endif %}<div class="event-time">{{ e.timestamp }}</div><div class="event-details">{{ e.details }}</div></div>{% else %}<p style="color:#666;">ما فيه أحداث مسجلة بعد.</p>{% endfor %}</body></html>
