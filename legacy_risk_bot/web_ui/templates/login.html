<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>دخول - Risk Guard</title>
<style>body{font-family:-apple-system,Tahoma,sans-serif;background:#0f1115;color:#eee;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}.box{background:#1a1d24;padding:32px;border-radius:12px;width:300px;text-align:center;}input{width:100%;padding:10px;margin-top:12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee;box-sizing:border-box;}button{width:100%;padding:10px;margin-top:16px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-weight:bold;cursor:pointer;}.error{color:#f87171;margin-top:10px;}h2{margin-top:0;}</style></head>
<body><div class="box"><h2>🛡️ Risk Guard</h2><form method="POST"><input type="password" name="token" placeholder="التوكن" required><button type="submit">دخول</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}</div></body></html>
